<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temp Monitor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg0: #060910;
  --bg1: rgba(255,255,255,0.03);
  --bg2: rgba(255,255,255,0.06);
  --bg3: rgba(255,255,255,0.10);
  --border: rgba(255,255,255,0.08);
  --border-hi: rgba(255,255,255,0.18);
  --txt: rgba(220,232,255,0.92);
  --txt2: rgba(160,185,230,0.6);
  --txt3: rgba(100,130,180,0.45);
  --cyan: #2de8ff;
  --cyan2: rgba(45,232,255,0.15);
  --orange: #ffaa44;
  --orange2: rgba(255,170,68,0.15);
  --green: #44ffb0;
}

html, body { width:100%; height:100%; overflow:hidden; }

body {
  font-family: 'Syne', sans-serif;
  color: var(--txt);
  background:
    radial-gradient(ellipse 90% 70% at 15% 5%,  rgba(20,50,200,0.3) 0%, transparent 55%),
    radial-gradient(ellipse 70% 60% at 85% 85%, rgba(80,10,140,0.28) 0%, transparent 55%),
    radial-gradient(ellipse 50% 40% at 55% 30%,  rgba(0,80,160,0.15) 0%, transparent 50%),
    var(--bg0);
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}

.shell {
  width: 960px;
  height: 580px;
  display: flex;
  border-radius: 22px;
  overflow: hidden;
  background: rgba(8,13,32,0.55);
  border: 1px solid var(--border);
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.03),
    0 40px 100px rgba(0,0,0,0.65),
    inset 0 1px 0 rgba(255,255,255,0.06);
  backdrop-filter: blur(40px) saturate(1.4);
}

/* ── SIDEBAR ─────────────────────────────── */
.sidebar {
  width: 220px;
  flex-shrink: 0;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  background: rgba(5,9,24,0.4);
}

.sidebar-head {
  padding: 20px 16px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
}

.sidebar-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--txt3);
}

.pulse-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 8px var(--green);
  animation: pulse 2.2s ease-in-out infinite;
}
@keyframes pulse {
  0%,100% { opacity:1; transform:scale(1); }
  50%      { opacity:0.4; transform:scale(0.7); }
}

.airport-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px 10px;
  scrollbar-width: none;
}
.airport-list::-webkit-scrollbar { display:none; }

.ap-card {
  border-radius: 11px;
  padding: 10px 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 3px;
  transition: background 0.18s, border-color 0.18s;
  border: 1px solid transparent;
}
.ap-card:hover { background: var(--bg2); border-color: var(--border); }
.ap-card.active {
  background: rgba(45,232,255,0.07);
  border-color: rgba(45,232,255,0.25);
}

.ap-left {}
.ap-code {
  font-size: 13px;
  font-weight: 600;
  color: var(--txt);
  letter-spacing: 0.04em;
}
.ap-card.active .ap-code { color: var(--cyan); }
.ap-city {
  font-size: 10.5px;
  color: var(--txt3);
  margin-top: 1px;
}

.ap-right { text-align: right; }
.ap-temp {
  font-family: 'JetBrains Mono', monospace;
  font-size: 15px;
  font-weight: 500;
  color: var(--txt);
}
.ap-trend {
  font-size: 10px;
  color: var(--txt3);
  margin-top: 1px;
  font-family: 'JetBrains Mono', monospace;
}

.sidebar-footer {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  font-size: 10px;
  color: var(--txt3);
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 0.04em;
}

/* ── MAIN ─────────────────────────────── */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

/* HEADER */
.main-head {
  padding: 20px 24px 16px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.city-block {}
.city-name {
  font-size: 28px;
  font-weight: 700;
  color: var(--txt);
  letter-spacing: -0.03em;
  line-height: 1;
}
.city-sub {
  font-size: 11px;
  color: var(--txt3);
  font-family: 'JetBrains Mono', monospace;
  margin-top: 5px;
  letter-spacing: 0.04em;
}
.city-sub span {
  color: var(--cyan);
  font-weight: 500;
}

.temp-block {
  text-align: right;
}
.temp-now {
  font-family: 'JetBrains Mono', monospace;
  font-size: 58px;
  font-weight: 300;
  color: var(--txt);
  line-height: 1;
  letter-spacing: -0.04em;
}
.temp-unit { font-size: 28px; color: var(--txt2); }
.temp-range {
  font-size: 11px;
  color: var(--txt3);
  font-family: 'JetBrains Mono', monospace;
  margin-top: 4px;
  letter-spacing: 0.03em;
}

/* TABS */
.tabs {
  display: flex;
  background: rgba(4,7,20,0.3);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.tab {
  flex: 1;
  padding: 9px 6px;
  font-size: 11.5px;
  font-weight: 500;
  color: var(--txt3);
  cursor: pointer;
  border: none;
  background: transparent;
  font-family: 'Syne', sans-serif;
  letter-spacing: 0.02em;
  border-bottom: 2px solid transparent;
  transition: color 0.15s, border-color 0.15s, background 0.15s;
  position: relative;
}
.tab:hover { color: var(--txt2); }
.tab.active {
  color: var(--cyan);
  border-bottom-color: var(--cyan);
  background: rgba(45,232,255,0.04);
}

/* CHART AREA */
.chart-zone {
  flex: 1;
  padding: 14px 20px 4px;
  position: relative;
  min-height: 0;
}
.chart-wrap {
  position: relative;
  width: 100%;
  height: 100%;
}

/* NOW LINE marker */
.now-badge {
  position: absolute;
  top: -2px;
  background: var(--cyan);
  color: #030810;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  font-weight: 500;
  padding: 2px 5px;
  border-radius: 4px;
  transform: translateX(-50%);
  pointer-events: none;
  white-space: nowrap;
  letter-spacing: 0.04em;
}

/* NUMERIC TEMP STRIP */
.tstrip {
  flex-shrink: 0;
  border-top: 1px solid var(--border);
  background: rgba(4,7,20,0.35);
  position: relative;
  height: 72px;
}
.tstrip-inner {
  display: flex;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 0 36px;
  height: 100%;
  align-items: center;
  gap: 0;
}
.tstrip-inner::-webkit-scrollbar { display:none; }

.t-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 8px 6px;
  border-radius: 9px;
  flex-shrink: 0;
  min-width: 52px;
  border: 1px solid transparent;
  position: relative;
}
.t-item.obs  { }
.t-item.now  {
  background: rgba(45,232,255,0.08);
  border-color: rgba(45,232,255,0.3);
}
.t-item.fc   { }

.t-time {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9.5px;
  color: var(--txt3);
  letter-spacing: 0.02em;
}
.t-item.now .t-time { color: var(--cyan); font-weight: 500; }

.t-val {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  font-weight: 500;
  line-height: 1;
}
.t-item.obs  .t-val { color: #ffaa44; }
.t-item.now  .t-val { color: var(--cyan); font-size: 15px; }
.t-item.fc   .t-val { color: rgba(160,190,230,0.7); }

.t-kind {
  font-size: 8.5px;
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.t-item.obs  .t-kind { color: rgba(255,170,68,0.45); }
.t-item.now  .t-kind { color: rgba(45,232,255,0.6); }
.t-item.fc   .t-kind { color: var(--txt3); }

.tstrip-arrow {
  position: absolute;
  top: 0; bottom: 0;
  width: 34px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  color: var(--txt2);
  cursor: pointer;
  z-index: 2;
}
.tstrip-arrow.left  { left:0;  background: linear-gradient(to right, rgba(4,7,20,0.92) 60%, transparent); }
.tstrip-arrow.right { right:0; background: linear-gradient(to left,  rgba(4,7,20,0.92) 60%, transparent); }

/* LEGEND */
.legend-row {
  display: flex;
  gap: 16px;
  padding: 0 20px 9px;
  flex-shrink: 0;
}
.leg {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 10.5px;
  color: var(--txt3);
}
.leg-line {
  width: 18px; height: 2px;
  border-radius: 1px;
}
.leg-dash {
  width: 18px; height: 0;
  border-top: 1.5px dashed rgba(140,160,200,0.35);
}
</style>
</head>
<body>

<div class="shell">
  <aside class="sidebar">
    <div class="sidebar-head">
      <span class="sidebar-label">Live Stations</span>
      <div class="pulse-dot"></div>
    </div>
    <div class="airport-list" id="apList"></div>
    <div class="sidebar-footer" id="nowTs">—</div>
  </aside>

  <main class="main">
    <div class="main-head">
      <div class="city-block">
        <div class="city-name" id="cityName">—</div>
        <div class="city-sub" id="citySub">—</div>
      </div>
      <div class="temp-block">
        <div class="temp-now" id="tempNow">—<span class="temp-unit">°C</span></div>
        <div class="temp-range" id="tempRange">—</div>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" onclick="setTab(0,this)">Forecast · ±12h</button>
      <button class="tab" onclick="setTab(1,this)">Extended · 3d</button>
    </div>

    <div class="chart-zone">
      <div class="chart-wrap">
        <canvas id="ch"></canvas>
      </div>
    </div>

    <div class="legend-row">
      <div class="leg"><div class="leg-line" style="background:#2de8ff"></div> Forecast</div>
      <div class="leg"><div class="leg-line" style="background:#ffaa44"></div> Observed</div>
    </div>

    <div class="tstrip">
      <div class="tstrip-arrow left"  onclick="scrollT(-1)">‹</div>
      <div class="tstrip-inner" id="tStrip"></div>
      <div class="tstrip-arrow right" onclick="scrollT(1)">›</div>
    </div>
  </main>
</div>

function fmtShort(unix_ts) {
  const d = new Date(unix_ts * 1000);
  return d.toLocaleDateString('en-GB', { month:'short', day:'numeric', timeZone:'UTC' })
    + ' ' + d.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit', timeZone:'UTC' });
}
function sign(v) { return v > 0 ? '+' : ''; }
function tempColor(v) {
  if (v >= 20) return '#ff6b40';
  if (v >= 15) return '#ffaa44';
  if (v >= 10) return '#2de8ff';
  if (v >= 5)  return '#44b8ff';
  if (v >= 0)  return '#6688ee';
  return '#8866dd';
}

function buildSidebar() {
  const list = document.getElementById('apList');
  list.innerHTML = '';
  Object.keys(RAW).forEach(code => {
    const d = RAW[code];
    const meta = AIRPORT_META[code] || { city: code };
    const cur = d.current.v;
    const obs = d.observed;
    const prev = obs.length > 1 ? obs[obs.length-2].v : cur;
    const delta = cur - prev;
    const deltaStr = delta > 0 ? `+${delta}°` : delta < 0 ? `${delta}°` : '±0°';
    const el = document.createElement('div');
    el.className = 'ap-card' + (code === activeCode ? ' active' : '');
    el.innerHTML = `
      <div class="ap-left">
        <div class="ap-code">${code}</div>
        <div class="ap-city">${meta.city}</div>
      </div>
      <div class="ap-right">
        <div class="ap-temp" style="color:${tempColor(cur)}">${sign(cur)}${cur}°</div>
        <div class="ap-trend">${deltaStr}</div>
      </div>`;
    el.onclick = () => { activeCode = code; buildSidebar(); renderMain(); };
    list.appendChild(el);
  });
  const nowTs = RAW[activeCode].current.unix_ts;
  document.getElementById('nowTs').textContent = `UTC ${fmtTime(nowTs)} · ${fmtDate(nowTs)}`;
}

function buildChart(code, tab) {
  const d = RAW[code];
  const nowTs = d.current.unix_ts;
  const ctx = document.getElementById('ch').getContext('2d');
  if (chart) { chart.destroy(); chart = null; }

  let fcPts, obsWindow, nowIdx;

  if (tab === 0) {
    const from = nowTs - 12*3600, to = nowTs + 12*3600;
    fcPts = d.forecast.filter(p => p.unix_ts >= from && p.unix_ts <= to);
    obsWindow = d.observed.filter(p => p.unix_ts >= from && p.unix_ts <= nowTs);
    nowIdx = fcPts.findIndex(p => p.unix_ts >= nowTs);
  } else {
    fcPts = d.forecast.filter(p => p.unix_ts >= nowTs - 3600);
    obsWindow = d.observed.filter(p => p.unix_ts >= nowTs - 12*3600 && p.unix_ts <= nowTs);
    nowIdx = fcPts.findIndex(p => p.unix_ts >= nowTs);
  }
  if (nowIdx < 0) nowIdx = 0;

  const labels = fcPts.map(p => tab === 0 ? fmtTime(p.unix_ts) : fmtShort(p.unix_ts));

  // Align observed onto forecast grid (nearest within 600s)
  const obsAligned = fcPts.map(fp => {
    const near = obsWindow.find(o => Math.abs(o.unix_ts - fp.unix_ts) < 600);
    return near != null ? near.v : null;
  });

  const allVals = [...fcPts.map(p=>p.v), ...obsWindow.map(p=>p.v)];
  const minV = Math.min(...allVals) - 1;
  const maxV = Math.max(...allVals) + 1;
  const gridC = 'rgba(100,130,200,0.1)';
  const tickC = 'rgba(120,150,200,0.45)';

  // Find two bracket points around nowTs for precise interpolation
  const beforeIdx = fcPts.reduce((best, p, i) => p.unix_ts <= nowTs ? i : best, 0);
  const afterIdx  = fcPts.findIndex(p => p.unix_ts > nowTs);

  const nowLinePlugin = {
    id: 'nowLine',
    afterDraw(ch) {
      const meta = ch.getDatasetMeta(0);
      if (!meta.data.length) return;
      const { ctx: c, chartArea: { top, bottom } } = ch;

      let x;
      if (afterIdx > 0 && meta.data[beforeIdx] && meta.data[afterIdx]) {
        const x0 = meta.data[beforeIdx].x, x1 = meta.data[afterIdx].x;
        const t0 = fcPts[beforeIdx].unix_ts, t1 = fcPts[afterIdx].unix_ts;
        const frac = t1 > t0 ? (nowTs - t0) / (t1 - t0) : 0;
        x = x0 + frac * (x1 - x0);
      } else {
        x = meta.data[Math.min(nowIdx, meta.data.length-1)].x;
      }

      c.save();
      c.setLineDash([4,4]);
      c.strokeStyle = 'rgba(45,232,255,0.55)';
      c.lineWidth = 1.5;
      c.beginPath(); c.moveTo(x, top); c.lineTo(x, bottom); c.stroke();

      // NOW label at top of line
      c.setLineDash([]);
      c.fillStyle = '#2de8ff';
      c.font = '500 9px JetBrains Mono, monospace';
      c.textAlign = 'center';
      c.fillText('NOW', x, top + 10);
      c.restore();
    }
  };

  const cyanGrad = ctx.createLinearGradient(0,0,0,220);
  cyanGrad.addColorStop(0, 'rgba(45,232,255,0.2)');
  cyanGrad.addColorStop(1, 'rgba(45,232,255,0.0)');

  const orgGrad = ctx.createLinearGradient(0,0,0,220);
  orgGrad.addColorStop(0, 'rgba(255,170,68,0.2)');
  orgGrad.addColorStop(1, 'rgba(255,170,68,0.0)');

  chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [
        {
          label: 'Forecast',
          data: fcPts.map(p=>p.v),
          borderColor: '#2de8ff',
          borderWidth: 2,
          backgroundColor: cyanGrad,
          pointRadius: 0, pointHoverRadius: 4,
          tension: 0.35, fill: true, order: 2
        },
        {
          label: 'Observed',
          data: obsAligned,
          borderColor: '#ffaa44',
          borderWidth: 2,
          backgroundColor: orgGrad,
          pointRadius: 3,
          pointBackgroundColor: '#ffaa44',
          pointBorderColor: 'rgba(255,170,68,0.3)',
          pointBorderWidth: 3,
          pointHoverRadius: 5,
          tension: 0.35, fill: true,
          spanGaps: false, order: 1
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: { duration: 400, easing: 'easeInOutSine' },
      interaction: { mode:'index', intersect:false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: 'rgba(5,9,24,0.95)',
          borderColor: 'rgba(45,232,255,0.22)',
          borderWidth: 1,
          titleColor: 'rgba(160,185,230,0.55)',
          titleFont: { family:'JetBrains Mono', size:10 },
          bodyColor: 'rgba(220,232,255,0.9)',
          bodyFont: { family:'JetBrains Mono', size:12 },
          padding: 10, cornerRadius: 8,
          callbacks: {
            label: c => c.parsed.y == null ? null : ` ${c.dataset.label}: ${sign(c.parsed.y)}${c.parsed.y}°C`
          }
        }
      },
      scales: {
        x: {
          grid: { color: gridC, drawBorder:false },
          ticks: { color: tickC, font:{ family:'JetBrains Mono', size:9.5 }, maxRotation:0, maxTicksLimit: tab===1 ? 8 : 10 },
          border: { display:false }
        },
        y: {
          min: minV, max: maxV,
          grid: { color: gridC, drawBorder:false },
          ticks: { color: tickC, font:{ family:'JetBrains Mono', size:9.5 }, callback: v => (v>0?'+':'')+v+'°', stepSize:2 },
          border: { display:false }
        }
      }
    },
    plugins: [nowLinePlugin]
  });
}

function buildTempStrip(code, tab) {
  const d = RAW[code];
  const nowTs = d.current.unix_ts;
  const strip = document.getElementById('tStrip');
  strip.innerHTML = '';

  // Use same fcPts slicing logic as buildChart
  let fcPts, obsWindow;
  if (tab === 0) {
    const from = nowTs - 12*3600, to = nowTs + 12*3600;
    fcPts    = d.forecast.filter(p => p.unix_ts >= from && p.unix_ts <= to);
    obsWindow = d.observed.filter(p => p.unix_ts >= from && p.unix_ts <= nowTs);
  } else {
    fcPts    = d.forecast.filter(p => p.unix_ts >= nowTs - 3600);
    obsWindow = d.observed.filter(p => p.unix_ts >= nowTs - 12*3600 && p.unix_ts <= nowTs);
  }

  // Thin to max ~24 items for readability (keep every Nth)
  const MAX = 24;
  const step = Math.max(1, Math.ceil(fcPts.length / MAX));
  const visible = fcPts.filter((_, i) => i % step === 0);

  // Always include the bracket points around nowTs so NOW item is present
  const nowPt = fcPts.reduce((best, p) => Math.abs(p.unix_ts - nowTs) < Math.abs(best.unix_ts - nowTs) ? p : best, fcPts[0]);
  if (nowPt && !visible.find(p => p.unix_ts === nowPt.unix_ts)) {
    const insertIdx = visible.findIndex(p => p.unix_ts > nowPt.unix_ts);
    if (insertIdx === -1) visible.push(nowPt); else visible.splice(insertIdx, 0, nowPt);
  }

  let nowEl = null;

  visible.forEach(fp => {
    // Determine type: obs if we have a real observed reading within 600s, now if closest to nowTs, else fc
    const nearObs = obsWindow.find(o => Math.abs(o.unix_ts - fp.unix_ts) < 600);
    const isNow   = fp === nowPt;
    const v       = nearObs ? nearObs.v : fp.v;
    const kind    = isNow ? 'now' : nearObs ? 'obs' : 'fc';

    const el = document.createElement('div');
    el.className = `t-item ${kind}`;
    el.innerHTML = `<span class="t-kind">${kind}</span><span class="t-val">${sign(v)}${v}°</span><span class="t-time">${tab === 0 ? fmtTime(fp.unix_ts) : fmtShort(fp.unix_ts)}</span>`;
    strip.appendChild(el);
    if (isNow) nowEl = el;
  });

  if (nowEl) setTimeout(() => nowEl.scrollIntoView({ behavior:'smooth', inline:'center', block:'nearest' }), 80);
}

function renderMain() {
  const code = activeCode;
  const d = RAW[code];
  const meta = AIRPORT_META[code] || { city: code, tz: 'UTC' };
  const nowTs = d.current.unix_ts;

  document.getElementById('cityName').textContent = meta.city;
  document.getElementById('citySub').innerHTML =
    `${code} &nbsp;·&nbsp; Local <span>${fmtLocalTime(nowTs, meta.tz)}</span> &nbsp;·&nbsp; UTC ${fmtTime(nowTs)}`;

  const cur = d.current.v;
  document.getElementById('tempNow').innerHTML = `${sign(cur)}${cur}<span class="temp-unit">°C</span>`;

  const fcVals = d.forecast.map(p=>p.v);
  const minF = Math.min(...fcVals), maxF = Math.max(...fcVals);
  document.getElementById('tempRange').textContent =
    `forecast range  ${sign(minF)}${minF}° … ${sign(maxF)}${maxF}°`;

  buildChart(code, activeTab);
  buildTempStrip(code, activeTab);
}

function setTab(idx, btn) {
  activeTab = idx;
  document.querySelectorAll('.tab').forEach((b,i) => b.classList.toggle('active', i===idx));
  buildChart(activeCode, activeTab);
  buildTempStrip(activeCode, activeTab);
}

function scrollT(dir) {
  document.getElementById('tStrip').scrollLeft += dir * 200;
}

buildSidebar();
renderMain();
</script>
</body>
</html>
