<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Widget</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-annotation/3.0.1/chartjs-plugin-annotation.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0a0e1a;
  --card-bg: rgba(20, 25, 40, 0.6);
  --border: rgba(255, 255, 255, 0.08);
  --text: #e8ecf1;
  --text-muted: #8892a0;
  --accent: #00d4ff;
  --accent-glow: rgba(0, 212, 255, 0.3);
  --observed: #ff9500;
  --forecast: #00d4ff;
  --success: #34c759;
  --gradient-1: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  --gradient-2: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
}

html, body {
  width: 100%;
  height: 100vh;
  overflow: hidden;
}

body {
  font-family: 'Inter', sans-serif;
  background: 
    radial-gradient(ellipse at 20% 10%, rgba(102, 126, 234, 0.15) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 80%, rgba(118, 75, 162, 0.15) 0%, transparent 50%),
    var(--bg);
  color: var(--text);
  padding: 0;
  display: flex;
  justify-content: center;
}

.container {
  display: flex;
  width: 100%;
  max-width: 960px;
  height: 100vh;
  overflow: hidden;
}

.main-content {
  flex: 1;
  padding: 12px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.sidebar {
  width: 140px;
  flex-shrink: 0;
  background: rgba(20, 25, 40, 0.9);
  border-left: 1px solid var(--border);
  padding: 12px 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  height: 100vh;
  overflow-y: auto;
}

.sidebar-title {
  font-size: 12px;
  font-weight: 700;
  background: linear-gradient(135deg, #00d4ff, #667eea);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-align: center;
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.location-btn {
  padding: 8px 10px;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s ease;
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.location-btn:hover {
  background: rgba(255, 255, 255, 0.08);
  border-color: var(--accent);
}

.location-btn.active {
  background: rgba(0, 212, 255, 0.12);
  border-color: var(--accent);
  box-shadow: 0 0 12px var(--accent-glow);
}

.loc-code {
  font-weight: 600;
  font-size: 12px;
  letter-spacing: 0.05em;
}

.location-btn.active .loc-code {
  color: var(--accent);
}

.loc-name {
  font-size: 9px;
  color: var(--text-muted);
}

.location-btn.active .loc-name {
  color: rgba(0, 212, 255, 0.7);
}

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  flex-shrink: 0;
}

.header h1 {
  font-size: 14px;
  font-weight: 700;
  background: linear-gradient(135deg, #00d4ff, #667eea);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.header p {
  font-size: 10px;
  color: var(--text-muted);
}

.status-bar {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 4px 8px;
  background: rgba(0, 212, 255, 0.1);
  border: 1px solid rgba(0, 212, 255, 0.3);
  border-radius: 4px;
  font-size: 9px;
  color: var(--accent);
  flex-shrink: 0;
  white-space: nowrap;
}

.status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--success);
  animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.8); }
}

.loading {
  display: none;
  align-items: center;
  justify-content: center;
  min-height: 200px;
}

.loading.active {
  display: flex;
}

.spinner {
  width: 24px;
  height: 24px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

#content {
  display: flex;
  flex-direction: column;
  gap: 16px;
  flex: 1;
}

.widget {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  backdrop-filter: blur(10px);
}

.widget-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}

.widget-icon {
  width: 32px;
  height: 32px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}

.widget-icon.current { background: var(--gradient-1); }

.widget-title {
  font-size: 12px;
  font-weight: 600;
}

.widget-subtitle {
  font-size: 9px;
  color: var(--text-muted);
}

.current-temp {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.temp-block {
  display: flex;
  align-items: baseline;
  gap: 16px;
  flex-wrap: wrap;
}

.temp-main {
  display: flex;
  align-items: baseline;
  gap: 4px;
}

.temp-value {
  font-family: 'JetBrains Mono', monospace;
  font-size: 42px;
  font-weight: 500;
  line-height: 1;
  background: linear-gradient(180deg, var(--text), var(--text-muted));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.temp-unit {
  font-size: 20px;
  color: var(--text-muted);
}

.temp-meta {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

.meta-item {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.meta-label {
  font-size: 8px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.meta-value {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  font-weight: 500;
}

.temp-strip {
  margin-top: auto;
}

.strip-label {
  font-size: 8px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 6px;
  text-align: center;
}

.strip-container {
  display: flex;
  align-items: center;
  gap: 4px;
  overflow-x: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
  padding: 6px;
  height: 56px;
  background: rgba(0, 0, 0, 0.2);
  border-radius: 6px;
}

.strip-container::-webkit-scrollbar {
  height: 3px;
}

.strip-container::-webkit-scrollbar-track {
  background: transparent;
}

.strip-container::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 2px;
}

.strip-item {
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 5px 7px;
  border-radius: 5px;
  min-width: 40px;
  border: 1px solid transparent;
}

.strip-item.history {
  background: rgba(255, 149, 0, 0.1);
  border-color: rgba(255, 149, 0, 0.3);
}

.strip-item.current {
  background: rgba(0, 212, 255, 0.2);
  border-color: rgba(0, 212, 255, 0.5);
  transform: scale(1.08);
  box-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
}

.strip-item.forecast {
  background: rgba(102, 126, 234, 0.1);
  border-color: rgba(102, 126, 234, 0.3);
}

.strip-time {
  font-size: 7px;
  color: var(--text-muted);
  font-family: 'JetBrains Mono', monospace;
  line-height: 1;
  margin-bottom: 3px;
}

.strip-item.current .strip-time {
  color: var(--accent);
  font-weight: 600;
}

.strip-temp {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  font-weight: 600;
  line-height: 1;
}

.strip-item.history .strip-temp {
  color: var(--observed);
}

.strip-item.current .strip-temp {
  color: var(--accent);
  font-size: 14px;
}

.strip-item.forecast .strip-temp {
  color: #667eea;
}

.strip-type {
  font-size: 6px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-top: 2px;
  line-height: 1;
}

.charts-row {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.chart-container {
  position: relative;
  height: 200px;
  width: 100%;
}

.chart-legend {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--border);
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 9px;
  color: var(--text-muted);
}

.legend-line {
  width: 14px;
  height: 2px;
  border-radius: 1px;
}

.legend-line.observed {
  background: var(--observed);
}

.legend-line.forecast {
  background: var(--forecast);
}

@media (max-width: 900px) {
  body {
    flex-direction: column;
    height: auto;
    overflow-y: auto;
  }
  
  .container {
    flex-direction: column;
    height: auto;
  }
  
  .sidebar {
    width: 100%;
    height: auto;
    flex-direction: row;
    flex-wrap: wrap;
    padding: 12px;
    gap: 8px;
    border-left: none;
    border-bottom: 1px solid var(--border);
  }
  
  .sidebar-title {
    width: 100%;
    margin-bottom: 4px;
  }
  
  .location-btn {
    padding: 8px 10px;
    min-width: 80px;
  }
  
  .main-content {
    padding: 12px;
  }
  
  .current-temp {
    flex-direction: column;
    align-items: center;
  }
  
  .temp-value {
    font-size: 48px;
  }
}
</style>
</head>
<body>

<div class="container">
  <main class="main-content">
    <div class="header">
      <h1>🌤️ Weather Monitor</h1>
      <p>Live airport temperatures</p>
    </div>

    <div id="loading" class="loading">
      <div class="spinner"></div>
    </div>

    <div id="content" style="display: none;">
      <div class="widget">
        <div class="widget-header">
          <div class="widget-icon current">🌡️</div>
          <div style="flex: 1;">
            <div class="widget-title">Current Temperature</div>
            <div class="widget-subtitle" id="currentLocation">—</div>
          </div>
          <div class="status-bar" id="statusBar">
            <div class="status-dot"></div>
            <span id="statusText">Live</span>
          </div>
        </div>
        <div class="current-temp">
          <div class="temp-block">
            <div class="temp-main">
              <div class="temp-value" id="currentTemp">--</div>
              <div class="temp-unit">°C</div>
            </div>
            <div class="temp-meta">
              <div class="meta-item">
                <div class="meta-label">Updated</div>
                <div class="meta-value" id="currentTime">--:--</div>
              </div>
              <div class="meta-item">
                <div class="meta-label">High</div>
                <div class="meta-value" id="tempHigh">--°</div>
              </div>
              <div class="meta-item">
                <div class="meta-label">Low</div>
                <div class="meta-value" id="tempLow">--°</div>
              </div>
            </div>
          </div>
          <div class="temp-strip">
            <div class="strip-label">4h · Now · +7h</div>
            <div class="strip-container" id="tempStrip"></div>
          </div>
        </div>
      </div>

      <div class="charts-row">
        <div class="widget">
          <div class="widget-header">
            <div>
              <div class="widget-title">7-Hour Forecast</div>
              <div class="widget-subtitle">15-min intervals</div>
            </div>
          </div>
          <div class="chart-container">
            <canvas id="chart7h"></canvas>
          </div>
          <div class="chart-legend">
            <div class="legend-item">
              <div class="legend-line observed"></div>
              <span>History</span>
            </div>
            <div class="legend-item">
              <div class="legend-line forecast"></div>
              <span>Forecast</span>
            </div>
          </div>
        </div>

        <div class="widget">
          <div class="widget-header">
            <div>
              <div class="widget-title">2-Day Forecast</div>
              <div class="widget-subtitle">Hourly data</div>
            </div>
          </div>
          <div class="chart-container">
            <canvas id="chart2d"></canvas>
          </div>
          <div class="chart-legend">
            <div class="legend-item">
              <div class="legend-line observed"></div>
              <span>History</span>
            </div>
            <div class="legend-item">
              <div class="legend-line forecast"></div>
              <span>Forecast</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <aside class="sidebar">
    <div class="sidebar-title">Locations</div>
    <div id="locationSelector"></div>
  </aside>
</div>

<script>
const API_BASE = 'https://p01--weather-api--cn5bkwlzyqr9.code.run';
const LOCATIONS = {
  'CYYZ': 'Toronto',
  'EGLC': 'London',
  'EPWA': 'Warsaw',
  'LFPG': 'Paris',
  'LLBG': 'Tel Aviv',
  'LTAC': 'Ankara',
  'RJTT': 'Tokyo',
  'ZBAA': 'Beijing',
  'ZHHH': 'Wuhan',
  'UUWW': 'Moscow',
  'ZUCK': 'Chongqing',
  'WSSS': 'Singapore',
  'EFHK': 'Helsinki',
  'RCSS': 'Taipei Songshan Airport'
};



let currentLocation = 'CYYZ';
let weatherData = null;
let chart7hInstance = null;
let chart2dInstance = null;

document.addEventListener('DOMContentLoaded', () => {
  initLocationSelector();
  fetchWeatherData();
});

function initLocationSelector() {
  const container = document.getElementById('locationSelector');
  container.innerHTML = Object.entries(LOCATIONS).map(([code, name]) => 
    `<button class="location-btn ${code === currentLocation ? 'active' : ''}" 
             onclick="selectLocation('${code}')">
       <span class="loc-code">${code}</span>
       <span class="loc-name">${name}</span>
     </button>`
  ).join('');
}

function selectLocation(code) {
  currentLocation = code;
  document.querySelectorAll('.location-btn').forEach(btn => {
    const btnCode = btn.querySelector('.loc-code').textContent;
    btn.classList.toggle('active', btnCode === code);
  });
  fetchWeatherData();
}

async function fetchWeatherData() {
  showLoading(true);
  updateStatus('Syncing...', false);
  
  try {
    const response = await fetch(`${API_BASE}/weather/all`);
    if (!response.ok) throw new Error('Failed to fetch');
    
    weatherData = await response.json();
    updateStatus('Live', true);
    renderAll();
  } catch (error) {
    console.error('Error:', error);
    updateStatus('Cached', false);
    if (weatherData) renderAll();
  } finally {
    showLoading(false);
  }
}

function showLoading(show) {
  document.getElementById('loading').classList.toggle('active', show);
  document.getElementById('content').style.display = show ? 'none' : 'flex';
}

function updateStatus(text, connected) {
  const dot = document.querySelector('.status-dot');
  document.getElementById('statusText').textContent = text;
  dot.style.background = connected ? 'var(--success)' : 'var(--observed)';
  const bar = document.getElementById('statusBar');
  if (connected) {
    bar.style.background = 'rgba(0, 212, 255, 0.1)';
    bar.style.borderColor = 'rgba(0, 212, 255, 0.3)';
    bar.style.color = 'var(--accent)';
  } else {
    bar.style.background = 'rgba(255, 149, 0, 0.1)';
    bar.style.borderColor = 'rgba(255, 149, 0, 0.3)';
    bar.style.color = 'var(--observed)';
  }
}

function renderAll() {
  const data = weatherData[currentLocation];
  if (!data) return;
  
  renderCurrentTemp(data);
  renderTempStrip(data);
  render7HourChart(data);
  render2DayChart(data);
}

function renderCurrentTemp(data) {
  const current = data.current;
  if (!current) return;
  
  document.getElementById('currentLocation').textContent = 
    `${currentLocation} — ${LOCATIONS[currentLocation]}`;
  document.getElementById('currentTemp').textContent = current.v;
  
  const date = new Date(current.unix_ts * 1000);
  document.getElementById('currentTime').textContent = 
    date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
  
  const now = new Date();
  const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime() / 1000;
  const todayEnd = todayStart + (24 * 60 * 60);
  
  const todayTemps = [
    ...(current.unix_ts >= todayStart && current.unix_ts < todayEnd ? [current.v] : []),
    ...(data.observed || []).filter(o => o.unix_ts >= todayStart && o.unix_ts < todayEnd).map(o => o.v),
    ...(data.forecast || []).filter(f => f.unix_ts >= todayStart && f.unix_ts < todayEnd).map(f => f.v)
  ];
  
  if (todayTemps.length > 0) {
    document.getElementById('tempHigh').textContent = `${Math.max(...todayTemps)}°`;
    document.getElementById('tempLow').textContent = `${Math.min(...todayTemps)}°`;
  }
}

function renderTempStrip(data) {
  const now = Math.floor(Date.now() / 1000);
  const fourHoursAgo = now - (4 * 60 * 60);
  const sevenHoursAhead = now + (7 * 60 * 60);
  
  const observed = data.observed || [];
  const forecast = data.forecast || [];
  const current = data.current;
  
  const stripItems = [];
  
  const historyItems = observed.filter(o => 
    o.unix_ts >= fourHoursAgo && 
    o.unix_ts < (current ? current.unix_ts - 60 : now)
  );
  
  historyItems.forEach(item => {
    const date = new Date(item.unix_ts * 1000);
    stripItems.push({
      type: 'history',
      time: date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }),
      temp: item.v,
      label: 'hist'
    });
  });
  
  if (current) {
    const date = new Date(current.unix_ts * 1000);
    stripItems.push({
      type: 'current',
      time: date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }),
      temp: current.v,
      label: 'now'
    });
  }
  
  const forecastItems = forecast.filter(f => 
    f.unix_ts > now && 
    f.unix_ts <= sevenHoursAhead &&
    f.res === '15m'
  );
  
  forecastItems.forEach(item => {
    const date = new Date(item.unix_ts * 1000);
    stripItems.push({
      type: 'forecast',
      time: date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }),
      temp: item.v,
      label: 'fc'
    });
  });
  
  const container = document.getElementById('tempStrip');
  container.innerHTML = stripItems.map(item => `
    <div class="strip-item ${item.type}">
      <div class="strip-time">${item.time}</div>
      <div class="strip-temp">${item.temp > 0 ? '+' : ''}${item.temp}°</div>
      <div class="strip-type">${item.label}</div>
    </div>
  `).join('');
  
  setTimeout(() => {
    const currentEl = container.querySelector('.strip-item.current');
    if (currentEl) {
      currentEl.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    }
  }, 100);
}

function render7HourChart(data) {
  const ctx = document.getElementById('chart7h').getContext('2d');
  
  const now = Math.floor(Date.now() / 1000);
  const fourHoursAgo = now - (4 * 60 * 60);
  const sevenHoursAhead = now + (7 * 60 * 60);
  
  const observed = data.observed || [];
  const forecast = data.forecast || [];
  const current = data.current;
  
  const historyData = observed.filter(o => o.unix_ts >= fourHoursAgo && o.unix_ts < now);
  const currentData = current ? [current] : [];
  const forecastData = forecast.filter(f => 
    f.unix_ts > now && 
    f.unix_ts <= sevenHoursAhead &&
    f.res === '15m'
  );
  
  const chartData = [...historyData, ...currentData, ...forecastData];
  chartData.sort((a, b) => a.unix_ts - b.unix_ts);
  
  const currentIdx = chartData.findIndex(d => d === current);
  const splitIdx = currentIdx >= 0 ? currentIdx + 0.5 : chartData.length;
  
  const labels = chartData.map(d => {
    const date = new Date(d.unix_ts * 1000);
    return date.toLocaleString('en-US', { 
      month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' 
    });
  });
  
  const temperatures = chartData.map(d => d.v);
  const pointTypes = chartData.map(d => {
    if (d === current) return 'Current';
    return d.unix_ts < now ? 'Observed' : 'Forecast';
  });
  
  const pointColors = pointTypes.map(t => {
    if (t === 'Current') return '#00d4ff';
    if (t === 'Observed') return '#ff9500';
    return '#00d4ff';
  });
  
  const gradient = ctx.createLinearGradient(0, 0, 0, 220);
  gradient.addColorStop(0, 'rgba(0, 212, 255, 0.3)');
  gradient.addColorStop(1, 'rgba(0, 212, 255, 0)');
  
  if (chart7hInstance) chart7hInstance.destroy();
  
  chart7hInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels: labels,
      datasets: [{
        label: 'Temperature',
        data: temperatures,
        borderColor: '#00d4ff',
        backgroundColor: gradient,
        borderWidth: 2,
        fill: true,
        tension: 0.4,

}

function render2DayChart(data) {
  const ctx = document.getElementById('chart2d').getContext('2d');
  
  const now = Math.floor(Date.now() / 1000);
  const fourHoursAgo = now - (4 * 60 * 60);
  const twoDaysAhead = now + (48 * 60 * 60);
  
  const observed = data.observed || [];
  const forecast = data.forecast || [];
  const current = data.current;
  
  const historyData = observed.filter(o => o.unix_ts >= fourHoursAgo && o.unix_ts < now);
  const currentData = current ? [current] : [];
  
  const allForecast = forecast.filter(f => 
    f.unix_ts > now && 
    f.unix_ts <= twoDaysAhead
  );
  
  const forecastMap = new Map();
  allForecast.forEach(f => {
    const existing = forecastMap.get(f.unix_ts);
    if (!existing || f.res === '15m') {
      forecastMap.set(f.unix_ts, f);
    }
  });
  
  const forecastData = Array.from(forecastMap.values());
  forecastData.sort((a, b) => a.unix_ts - b.unix_ts);
  
  const chartData = [...historyData, ...currentData, ...forecastData];
  chartData.sort((a, b) => a.unix_ts - b.unix_ts);
  
  const currentIdx = chartData.findIndex(d => d === current);
  const splitIdx = currentIdx >= 0 ? currentIdx + 0.5 : chartData.length;
  
  const labels = chartData.map(d => {
    const date = new Date(d.unix_ts * 1000);
    return date.toLocaleString('en-US', { 
      month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' 
    });
  });
  
  const temperatures = chartData.map(d => d.v);
  const pointTypes = chartData.map(d => {
    if (d === current) return 'Current';
    return d.unix_ts < now ? 'Observed' : 'Forecast';
  });
  
  const pointColors = pointTypes.map(t => {
    if (t === 'Current') return '#667eea';
    if (t === 'Observed') return '#ff9500';
    return '#667eea';
  });
  
  const gradient = ctx.createLinearGradient(0, 0, 0, 220);
  gradient.addColorStop(0, 'rgba(102, 126, 234, 0.3)');
  gradient.addColorStop(1, 'rgba(102, 126, 234, 0)');
  
  if (chart2dInstance) chart2dInstance.destroy();
  
  chart2dInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels: labels,
      datasets: [{
        label: 'Temperature',
        data: temperatures,
        borderColor: '#667eea',
        backgroundColor: gradient,
        borderWidth: 2,
        fill: true,
        tension: 0.3,
        pointRadius: 4,
        pointHoverRadius: 7,
        pointBackgroundColor: pointColors,
        pointBorderColor: '#fff',
        pointBorderWidth: 2
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: {
        intersect: false,
        mode: 'index',
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: 'rgba(10, 14, 26, 0.95)',
          titleColor: '#8892a0',
          bodyColor: '#e8ecf1',
          bodyFont: { family: 'JetBrains Mono', size: 13 },
          padding: 10,
          borderColor: 'rgba(255,255,255,0.1)',
          borderWidth: 1,
          callbacks: {
            label: (ctx) => `${ctx.parsed.y}°C`,
            title: (items) => {
              const idx = items[0].dataIndex;
              const point = chartData[idx];
              const res = point.res ? `(${point.res})` : '';
              return `${labels[idx]} — ${pointTypes[idx]} ${res}`;
            }
          }
        },
        annotation: {
          annotations: {
            splitLine: {
              type: 'line',
              xMin: splitIdx,
              xMax: splitIdx,
              borderColor: 'rgba(255, 255, 255, 0.3)',
              borderWidth: 2,
              borderDash: [6, 6],
              label: {
                display: true,
                content: 'NOW',
                position: 'start',
                backgroundColor: 'rgba(10, 14, 26, 0.8)',
                color: '#667eea',
                font: { size: 9, family: 'JetBrains Mono' },
                padding: 3,
                xAdjust: 0,
                yAdjust: -110
              }
            }
          }
        }
      },
      scales: {
        x: {
          grid: { color: 'rgba(255,255,255,0.05)' },
          ticks: { color: '#8892a0', maxRotation: 45, minRotation: 45, font: { size: 10 } }
        },
        y: {
          grid: { color: 'rgba(255,255,255,0.05)' },
          ticks: { color: '#8892a0', callback: (val) => `${val}°`, font: { size: 10 } }
        }
      }
    }
  });
}

  fetchWeatherData();
